name: Update README cards

on:
  schedule:
    - cron: "17 3 * * *"       # daily, 03:17 UTC
  workflow_dispatch:            # run by hand from the Actions tab
  push:
    branches: [main]
    paths: ["scripts/**", "fonts/**", "assets/**"]

permissions:
  contents: write               # only needed to commit the regenerated cards

concurrency:
  group: update-readme
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch contribution data
        env:
          # PROFILE_TOKEN is optional (private contributions). The token is read from the
          # environment only; it is never written to files, SVGs or logs.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_contributions.py

      - name: Render cards
        run: python scripts/render_readme_cards.py

      - name: Validate SVGs
        run: python scripts/validate_cards.py

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/contributions.json cards README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update README cards"
            git push
          fi
