<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 112" width="880" height="112" role="img" aria-labelledby="t d"><title id="t">What I’m building</title><desc id="d">Selected projects.</desc><style>@font-face{font-family:'GeistMono';font-style:normal;font-weight:400;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'InstrumentSerif';font-style:normal;font-weight:400;src:url(data:font/woff;base64,) format('woff')}.f-serif,.f-serif-i{font-family:'InstrumentSerif','Instrument Serif',Georgia,'Times New Roman',serif;font-weight:400}.f-serif-i{font-style:italic}.f-sans,.f-sans-m{font-family:Geist,'Helvetica Neue',Arial,sans-serif;font-weight:400}.f-sans-m{font-weight:500}.f-mono{font-family:'GeistMono','Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400}text{font-variant-ligatures:none}.pre{white-space:pre}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes col{from{opacity:0;transform:translateY(4px)}}
@keyframes print{from{opacity:0;transform:translateY(-3px)}}
@keyframes growy{from{transform:scaleY(0)}}
@keyframes growx{from{transform:scaleX(0)}}
.fade{animation:fade .6s ease-out var(--d,0s) backwards}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) var(--d,0s) backwards}
.col{animation:col .5s ease-out var(--d,0s) backwards}
.print{animation:print .3s ease-out var(--d,0s) backwards}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:growy .8s cubic-bezier(.2,.7,.2,1) var(--d,0s) backwards}
.rule{transform-box:fill-box;transform-origin:0 50%;animation:growx .8s cubic-bezier(.2,.7,.2,1) var(--d,0s) backwards}
.still{display:none}
@media (prefers-reduced-motion:reduce){
*{animation:none!important;transition:none!important}
.smil{display:none}
.still{display:inline}
}
</style><defs></defs><rect class="fade" x="0" y="0" width="880" height="112" rx="16" fill="#F5F3EC" style="--d:5.70s"/><text x="40" y="72" font-size="54" fill="#252B32" class="f-serif rise" letter-spacing="-0.5" style="--d:5.90s">What I’m building</text><text x="840" y="70" font-size="10.5" fill="#6c6f71" class="f-mono rise" text-anchor="end" letter-spacing="1.4" style="--d:6.05s">SELECTED PROJECTS</text><rect class="rule" x="40" y="92" width="800" height="1" rx="0" fill="#d4d3ce" style="--d:6.10s"/></svg>
